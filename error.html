  <!-- Everything is inline on purpose. Apache serves this page at whatever
       address failed — /a/b/c/missing — so a relative stylesheet would not
       resolve, and a root-relative one dies the moment the site moves into a
       subfolder or is opened from disk. An error page must not depend on
       other files loading correctly; the error may be that they don't. -->
  <style>
    :root {
      --ivory:      #F8F5EE;
      --ivory-deep: #EDE6D8;
      --bronze:     #8A5A2B;
      --bronze-soft:#A97645;
      --bronze-light:#C49A6C;
      --brown:      #3A2617;
      --brown-mid:  #5A422E;
      --brown-soft: #7A6450;
      --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
      --font-sans:    'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(2rem, 6vw, 4rem) 1.25rem;
      background: var(--ivory);
      color: var(--brown);
      font-family: var(--font-sans);
      line-height: 1.75;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    /* Warm light pooling behind the word, as on the home hero */
    body::before {
      content: '';
      position: fixed;
      left: 50%; top: 45%;
      width: min(900px, 120vw);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle at 50% 45%, rgba(201, 162, 39, 0.15), transparent 55%),
        radial-gradient(circle at 50% 55%, rgba(138, 90, 43, 0.12), transparent 62%);
      pointer-events: none;
      z-index: 0;
    }

    /* Full width so the display word is never wider than its own containing
       block — an overflowing line is pinned to the left edge and stops
       looking centred. Only the prose is held to a readable measure. */
    .err { position: relative; z-index: 1; width: 100%; max-width: 62rem; }

    .err__brand {
      display: inline-block;
      font-family: var(--font-sans);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--bronze);
      margin-bottom: clamp(1.5rem, 5vw, 2.75rem);
    }

    /* Capitalised in CSS, not in the markup — a screen reader would spell
       out a literal "ERROR" letter by letter. */
    .err__word {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(4.25rem, 19vw, 12rem);
      line-height: 0.85;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      /* Optical centring. Two corrections, both in em so they hold at every
         size: letter-spacing trails the last R (cancelled by the negative
         margin), and Cormorant sets E with a wider left sidebearing than the
         final R's right one, which reads as a nudge to the right. */
      margin-right: -0.04em;
      transform: translateX(-0.026em);
      color: var(--brown);
    }

    .err__label {
      display: block;
      max-width: 34rem;
      margin-inline: auto;
      margin-top: clamp(1.5rem, 4vw, 2.25rem);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      line-height: 1.6;
      color: var(--bronze);
    }

    .err__msg {
      max-width: 34rem;
      margin-inline: auto;
      margin-top: 0.9rem;
      font-size: 1rem;
      color: var(--brown-soft);
      text-wrap: pretty;
    }

    /* Same pill as the site's .btn — brown, with a bronze wash on hover */
    .err__btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-top: clamp(2rem, 5vw, 2.75rem);
      padding: 1.05rem 2.1rem;
      border-radius: 15px;
      overflow: hidden;
      isolation: isolate;
      background: var(--brown);
      color: var(--ivory);
      font-size: 0.86rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: box-shadow 0.45s var(--ease), transform 0.45s var(--ease);
    }
    .err__btn::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(120deg, var(--bronze), var(--bronze-soft) 55%, var(--bronze-light));
      transform: translateY(101%);
      transition: transform 0.55s var(--ease);
      z-index: -1;
    }
    .err__btn:hover::after, .err__btn:focus-visible::after { transform: translateY(0); }
    .err__btn:hover { box-shadow: 0 16px 34px -16px rgba(138, 90, 43, 0.65); }
    .err__btn:active { transform: scale(0.98); }
    .err__btn svg { transition: transform 0.45s var(--ease); }
    .err__btn:hover svg { transform: translateX(4px); }

    :focus-visible { outline: 2px solid var(--bronze); outline-offset: 3px; }

    /* Same scrollbar as the rest of the site, restated because this page
       cannot rely on base.css loading */
    html { scrollbar-width: thin; scrollbar-color: var(--brown) var(--ivory-deep); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--ivory-deep); }
    ::-webkit-scrollbar-thumb {
      background: var(--brown);
      background-clip: padding-box;
      border: 2px solid transparent;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--brown-mid); background-clip: padding-box; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.001ms !important; }
    }
  </style>
</head>

<body>

  <main class="err">
    <a class="err__brand" href="/">Siam Consult</a>

    <h1 class="err__word">Error</h1>

    <!-- Defaults read correctly for any status; the script sharpens them
         once it knows which one this is. -->
    <span class="err__label" data-label>Page unavailable</span>
    <p class="err__msg" data-msg>The page you asked for could not be reached.</p>

    <a class="err__btn" href="/">
      Back to home
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </a>
  </main>

  <!-- .htaccess passes the status as a query string (/error.html?404). If a
       server strips it, the defaults above still make sense — nothing here
       is load-bearing. -->
  <script>
    (function () {
      var COPY = {
        '400': ['Bad request',       'That request could not be understood.'],
        '401': ['Not public',        'This page is not open to the public.'],
        '403': ['Not public',        'This page is not open to the public.'],
        '404': ['Page not found',    'The address you followed does not lead anywhere on this site.'],
        '405': ['Not allowed',       'That action is not permitted here.'],
        '408': ['Request timed out', 'The connection took too long. Please try again.'],
        '410': ['Page removed',      'This page has been taken down for good.'],
        '429': ['Too many requests', 'Please wait a moment, then try again.'],
        '500': ['Server error',      'Something went wrong on our side. We are looking into it.'],
        '502': ['Server error',      'Something went wrong on our side. We are looking into it.'],
        '503': ['Unavailable',       'The site is briefly unavailable. Please try again shortly.'],
        '504': ['Server error',      'Something went wrong on our side. We are looking into it.']
      };

      var code = (location.search.match(/\d{3}/) || [])[0];
      var copy = COPY[code];
      if (!copy) return;

      document.querySelector('[data-label]').textContent = code + ' — ' + copy[0];
      document.querySelector('[data-msg]').textContent = copy[1];
      document.title = code + ' ' + copy[0] + ' — Siam Consult Phuket';
    })();
  </script>
</body>
